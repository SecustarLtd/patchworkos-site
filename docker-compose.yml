services:
  patchworkos:
    build: .
    container_name: patchworkos
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PATCHWORK_HOST_PORT:-3107}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /app/data/patchwork.db
      BACKUPS_DIR: /app/data/backups
    volumes:
      - patchworkos_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  patchworkos_data:
